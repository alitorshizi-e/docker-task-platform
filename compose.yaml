services:
  nginx:
    image: nginx:alpine

    ports:
      - "127.0.0.1:8080:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      app:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - frontend_network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/nginx-health >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s


  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: docker-task-platform-app:0.3

    expose:
      - "8000"

    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: "6379"

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    networks:
      - frontend_network
      - backend_network

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s


  db:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

    networks:
      - backend_network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s


  redis:
    image: redis:7-alpine

    restart: unless-stopped

    networks:
      - backend_network

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s


volumes:
  postgres_data:


networks:
  frontend_network:
    driver: bridge

  backend_network:
    driver: bridge